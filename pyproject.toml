[build-system]
requires = ["setuptools>=77", "packaging>=24"]
build-backend = "setuptools.build_meta"

[project]
name = "ruyijs"
version = "0.2.1"
description = "Firefox SpiderMonkey JavaScript contexts and native browser APIs for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL-LICENSE.md"]
authors = [{name = "ruyijs contributors"}]
keywords = ["javascript", "spidermonkey", "firefox", "browser", "dom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests; sys_platform == 'darwin'",
    "brotli; sys_platform == 'darwin'",
    "zstandard; sys_platform == 'darwin'",
]

[tool.setuptools]
packages = ["ruyijs"]
package-dir = {"" = "python"}
include-package-data = false
